<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>threejs-from-scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 800px;
      height: 450px;
      overflow: hidden;
      background: #000;
    }
    canvas, img {
      display: block;
      width: 800px;
      height: 450px;
    }
  </style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.min.js';

const WIDTH = 800;
const HEIGHT = 450;
const params = new URLSearchParams(location.search);
const sceneUrl = params.get('scene') || '/artifacts/increment2/scene.json';
const physicsUrl = params.get('physics') || '/artifacts/increment2/physics.json';
const trajectoryUrl = params.get('trajectory');

const spec = await (await fetch(sceneUrl)).json();
let poses = {};
function applyBodies(list) {
  for (const b of list || []) poses[b.id] = b;
}
try {
  if (trajectoryUrl) {
    const traj = await (await fetch(trajectoryUrl)).json();
    const frames = traj.frames || [];
    let idx = frames.length - 1;
    if (params.has('frame')) idx = parseInt(params.get('frame'), 10);
    if (idx < 0 || idx >= frames.length) idx = frames.length - 1;
    if (frames[idx]) applyBodies(frames[idx].bodies);
  } else {
    const phys = await (await fetch(physicsUrl)).json();
    if (phys.frames && phys.frames.length) {
      applyBodies(phys.frames[phys.frames.length - 1].bodies);
    } else {
      applyBodies(phys.bodies);
    }
  }
} catch (e) {
  // render authored poses if physics/trajectory is missing
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5cad0);

const camera = new THREE.PerspectiveCamera(spec.camera.fov_y_deg, WIDTH / HEIGHT, 0.1, 100);
const camParam = params.get('cam');
if (camParam) {
  const xyz = camParam.split(',').map(Number);
  if (xyz.length === 3 && xyz.every((n) => Number.isFinite(n))) {
    camera.position.set(xyz[0], xyz[1], xyz[2]);
  } else {
    camera.position.fromArray(spec.camera.position);
  }
} else {
  camera.position.fromArray(spec.camera.position);
}
camera.lookAt(...spec.camera.look_at);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// RectAreaLight needs LTC lookup textures (RectAreaLightUniformsLib in full Three.js).
function ensureRectAreaLTC() {
  const lib = THREE.UniformsLib;
  if (!lib || lib.LTC_FLOAT_1) return;
  const n = 64;
  const data = new Float32Array(n * n * 4);
  for (let i = 0; i < n * n; i++) {
    data[i * 4 + 0] = 1;
    data[i * 4 + 1] = 0;
    data[i * 4 + 2] = 0;
    data[i * 4 + 3] = 1;
  }
  const make = () => {
    const tex = new THREE.DataTexture(data, n, n, THREE.RGBAFormat, THREE.FloatType);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  };
  lib.LTC_FLOAT_1 = make();
  lib.LTC_FLOAT_2 = make();
  lib.LTC_HALF_1 = lib.LTC_FLOAT_1;
  lib.LTC_HALF_2 = lib.LTC_FLOAT_2;
}
ensureRectAreaLTC();

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  alpha: false,
});
renderer.setSize(WIDTH, HEIGHT, true);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

for (const light of spec.lights) {
  if (light.type === 'directional') {
    const sun = new THREE.DirectionalLight(0xffffff, light.intensity);
    sun.color.setRGB(...light.color);
    sun.position.set(-light.direction[0], -light.direction[1], -light.direction[2]);
    sun.target.position.set(0, 0, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
    sun.shadow.camera.right = sun.shadow.camera.top = 8;
    scene.add(sun);
    scene.add(sun.target);
  } else if (light.type === 'point') {
    const pl = new THREE.PointLight(0xffffff, light.intensity);
    pl.color.setRGB(...light.color);
    pl.position.fromArray(light.position);
    pl.castShadow = true;
    pl.shadow.mapSize.set(1024, 1024);
    pl.shadow.camera.near = 0.1;
    pl.shadow.camera.far = 20;
    scene.add(pl);
  } else if (light.type === 'area') {
    const w = (light.size && light.size[0]) || 1;
    const h = (light.size && light.size[1]) || 1;
    const al = new THREE.RectAreaLight(0xffffff, light.intensity, w, h);
    al.color.setRGB(...light.color);
    al.position.fromArray(light.position);
    const n = light.normal || [0, -1, 0];
    al.lookAt(al.position.x + n[0], al.position.y + n[1], al.position.z + n[2]);
    scene.add(al);
  }
}

function readAccessor(gltf, bin, accIndex) {
  const acc = gltf.accessors[accIndex];
  const view = gltf.bufferViews[acc.bufferView];
  const offset = (view.byteOffset || 0) + (acc.byteOffset || 0);
  const ctype = acc.componentType;
  const comps = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[acc.type] || 1;
  const elemSize = { 5120: 1, 5121: 1, 5122: 2, 5123: 2, 5125: 4, 5126: 4 }[ctype];
  const stride = view.byteStride || (elemSize * comps);
  const out = [];
  for (let i = 0; i < acc.count; i++) {
    const o = offset + i * stride;
    const row = [];
    for (let c = 0; c < comps; c++) {
      const p = o + c * elemSize;
      if (ctype === 5126) row.push(new DataView(bin.buffer, bin.byteOffset + p, 4).getFloat32(0, true));
      else if (ctype === 5125) row.push(new DataView(bin.buffer, bin.byteOffset + p, 4).getUint32(0, true));
      else if (ctype === 5123) row.push(new DataView(bin.buffer, bin.byteOffset + p, 2).getUint16(0, true));
      else if (ctype === 5121) row.push(bin[p]);
      else throw new Error('unsupported componentType ' + ctype);
    }
    out.push(row);
  }
  return out;
}

function decodeBase64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function loadGltfBuffer(gltfUrl, buffer) {
  if (!buffer.uri) throw new Error('gltf buffer missing uri');
  if (buffer.uri.startsWith('data:')) {
    const i = buffer.uri.indexOf('base64,');
    if (i < 0) throw new Error('data uri is not base64');
    return decodeBase64(buffer.uri.slice(i + 7));
  }
  const url = new URL(buffer.uri, new URL(gltfUrl, location.href)).href;
  return new Uint8Array(await (await fetch(url)).arrayBuffer());
}

async function geomFromGLTF(url) {
  if (/\.glb$/i.test(url)) {
    const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('not a glb');
    let off = 12;
    let json = null;
    let bin = null;
    while (off + 8 <= bytes.length) {
      const chunkLen = dv.getUint32(off, true);
      const chunkType = dv.getUint32(off + 4, true);
      off += 8;
      const data = bytes.subarray(off, off + chunkLen);
      if (chunkType === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(data));
      else if (chunkType === 0x004E4942) bin = data;
      off += chunkLen;
    }
    if (!json) throw new Error('glb missing JSON');
    return geomFromGltfJson(json, bin, url);
  }
  const gltf = await (await fetch(url)).json();
  const bin = await loadGltfBuffer(url, gltf.buffers[0]);
  return geomFromGltfJson(gltf, bin, url);
}

function pbrFromGltf(gltf, prim, gltfUrl) {
  if (prim.material === undefined || !gltf.materials) return null;
  const mat = gltf.materials[prim.material];
  if (!mat) return null;
  const pbr = mat.pbrMetallicRoughness || {};
  const factor = pbr.baseColorFactor || [1, 1, 1, 1];
  let textureUrl = null;
  if (pbr.baseColorTexture && gltf.textures && gltf.images) {
    const tex = gltf.textures[pbr.baseColorTexture.index];
    if (tex && tex.source !== undefined) {
      const img = gltf.images[tex.source];
      if (img && img.uri) {
        textureUrl = img.uri.startsWith('data:')
          ? img.uri
          : new URL(img.uri, new URL(gltfUrl, location.href)).href;
      }
    }
  }
  let mrTextureUrl = null;
  if (pbr.metallicRoughnessTexture && gltf.textures && gltf.images) {
    const tex = gltf.textures[pbr.metallicRoughnessTexture.index];
    if (tex && tex.source !== undefined) {
      const img = gltf.images[tex.source];
      if (img && img.uri) {
        mrTextureUrl = img.uri.startsWith('data:')
          ? img.uri
          : new URL(img.uri, new URL(gltfUrl, location.href)).href;
      }
    }
  }
  let normalTextureUrl = null;
  if (mat.normalTexture && gltf.textures && gltf.images) {
    const tex = gltf.textures[mat.normalTexture.index];
    if (tex && tex.source !== undefined) {
      const img = gltf.images[tex.source];
      if (img && img.uri) {
        normalTextureUrl = img.uri.startsWith('data:')
          ? img.uri
          : new URL(img.uri, new URL(gltfUrl, location.href)).href;
      }
    }
  }
  let emissiveTextureUrl = null;
  if (mat.emissiveTexture && gltf.textures && gltf.images) {
    const tex = gltf.textures[mat.emissiveTexture.index];
    if (tex && tex.source !== undefined) {
      const img = gltf.images[tex.source];
      if (img && img.uri) {
        emissiveTextureUrl = img.uri.startsWith('data:')
          ? img.uri
          : new URL(img.uri, new URL(gltfUrl, location.href)).href;
      }
    }
  }
  let occlusionTextureUrl = null;
  let occlusionStrength = 1;
  if (mat.occlusionTexture && gltf.textures && gltf.images) {
    const tex = gltf.textures[mat.occlusionTexture.index];
    if (tex && tex.source !== undefined) {
      const img = gltf.images[tex.source];
      if (img && img.uri) {
        occlusionTextureUrl = img.uri.startsWith('data:')
          ? img.uri
          : new URL(img.uri, new URL(gltfUrl, location.href)).href;
      }
    }
    if (mat.occlusionTexture.strength !== undefined) occlusionStrength = mat.occlusionTexture.strength;
  }
  let transmission = 0;
  let ior = mat.ior === undefined ? 1.5 : mat.ior;
  let attenuationColor = [1, 1, 1];
  let attenuationDistance = Infinity;
  let thickness = 0;
  let dispersion = 0;
  if (mat.extensions && mat.extensions.KHR_materials_transmission) {
    const tf = mat.extensions.KHR_materials_transmission.transmissionFactor;
    if (tf !== undefined) transmission = tf;
  }
  if (mat.extensions && mat.extensions.KHR_materials_ior && mat.extensions.KHR_materials_ior.ior !== undefined) {
    ior = mat.extensions.KHR_materials_ior.ior;
  }
  if (mat.extensions && mat.extensions.KHR_materials_volume) {
    const vol = mat.extensions.KHR_materials_volume;
    if (vol.attenuationColor) attenuationColor = vol.attenuationColor;
    if (vol.attenuationDistance !== undefined) attenuationDistance = vol.attenuationDistance;
    if (vol.thicknessFactor !== undefined) thickness = vol.thicknessFactor;
  }
  if (mat.extensions && mat.extensions.KHR_materials_dispersion) {
    const d = mat.extensions.KHR_materials_dispersion.dispersion;
    if (d !== undefined) dispersion = d;
  }
  return {
    baseColorFactor: factor,
    metallicFactor: pbr.metallicFactor === undefined ? 1 : pbr.metallicFactor,
    roughnessFactor: pbr.roughnessFactor === undefined ? 1 : pbr.roughnessFactor,
    textureUrl,
    mrTextureUrl,
    normalTextureUrl,
    normalScale: mat.normalTexture && mat.normalTexture.scale !== undefined ? mat.normalTexture.scale : 1,
    emissiveFactor: mat.emissiveFactor || [0, 0, 0],
    emissiveTextureUrl,
    occlusionTextureUrl,
    occlusionStrength,
    transmission,
    ior,
    attenuationColor,
    attenuationDistance,
    thickness,
    dispersion,
    alphaMode: mat.alphaMode || 'OPAQUE',
    opacity: factor.length > 3 ? factor[3] : 1,
    doubleSided: !!mat.doubleSided,
  };
}

function geomFromGltfJson(gltf, bin, gltfUrl) {
  const prim = gltf.meshes[0].primitives[0];
  const mode = prim.mode === undefined ? 4 : prim.mode;
  if (mode !== 4) throw new Error('only TRIANGLES glTF is supported');
  const positions = readAccessor(gltf, bin, prim.attributes.POSITION);
  let uvs = null;
  if (prim.attributes.TEXCOORD_0 !== undefined) {
    uvs = readAccessor(gltf, bin, prim.attributes.TEXCOORD_0);
  }
  let indices;
  if (prim.indices !== undefined) {
    indices = readAccessor(gltf, bin, prim.indices).map(r => r[0]);
  } else {
    indices = positions.map((_, i) => i);
  }
  const posAttr = [];
  const uvAttr = [];
  for (const idx of indices) {
    posAttr.push(...positions[idx]);
    if (uvs && uvs[idx]) uvAttr.push(uvs[idx][0], uvs[idx][1]);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(posAttr, 3));
  if (uvAttr.length === (posAttr.length / 3) * 2) {
    geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvAttr, 2));
  }
  geom.computeVertexNormals();
  if (geom.getAttribute('uv') && geom.getAttribute('normal')) {
    const nVerts = posAttr.length / 3;
    if (!geom.getIndex()) {
      geom.setIndex(Array.from({ length: nVerts }, (_, i) => i));
    }
    try { geom.computeTangents(); } catch (e) { /* optional */ }
  }
  return { geom, pbr: pbrFromGltf(gltf, prim, gltfUrl || '') };
}

function geomFromOBJ(text) {
  const verts = [];
  const uvs = [];
  const positions = [];
  const uvAttr = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const p = line.split(/\s+/);
    if (p[0] === 'v' && p.length >= 4) {
      verts.push([+p[1], +p[2], +p[3]]);
    } else if (p[0] === 'vt' && p.length >= 3) {
      uvs.push([+p[1], +p[2]]);
    } else if (p[0] === 'f') {
      const corners = p.slice(1).map(tok => {
        const s = tok.split('/');
        return {
          v: parseInt(s[0], 10) - 1,
          vt: s[1] ? parseInt(s[1], 10) - 1 : -1,
        };
      });
      for (let i = 1; i + 1 < corners.length; i++) {
        for (const c of [corners[0], corners[i], corners[i + 1]]) {
          positions.push(...verts[c.v]);
          if (c.vt >= 0 && uvs[c.vt]) uvAttr.push(uvs[c.vt][0], uvs[c.vt][1]);
        }
      }
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  if (uvAttr.length === (positions.length / 3) * 2) {
    geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvAttr, 2));
  }
  geom.computeVertexNormals();
  return geom;
}

function loadTexture(url) {
  return new Promise((resolve, reject) => {
    const loader = new THREE.TextureLoader();
    loader.load(url, resolve, undefined, reject);
  });
}

for (const body of spec.bodies) {
  const pose = poses[body.id];
  const position = pose ? pose.position : body.position;
  const rotation = pose && pose.rotation_wxyz ? pose.rotation_wxyz : (body.rotation_wxyz || [1, 0, 0, 0]);
  let geom;
  let gltfPbr = null;
  if (body.shape.type === 'box') {
    geom = new THREE.BoxGeometry(...body.shape.size);
  } else if (body.shape.type === 'sphere') {
    geom = new THREE.SphereGeometry(body.shape.radius, 48, 32);
  } else if (body.shape.type === 'mesh') {
    const rel = body.shape.path || '';
    const url = rel.startsWith('/') ? rel : '/' + rel;
    if (/\.gltf$/i.test(rel) || /\.glb$/i.test(rel)) {
      const loaded = await geomFromGLTF(url);
      geom = loaded.geom;
      gltfPbr = loaded.pbr;
    } else {
      const objText = await (await fetch(url)).text();
      geom = geomFromOBJ(objText);
    }
  } else {
    continue;
  }
  const albedo = gltfPbr ? gltfPbr.baseColorFactor : body.material.albedo;
  const clearcoat = (body.material && body.material.clearcoat) || 0;
  const clearcoatRoughness = (body.material && body.material.clearcoat_roughness) || 0;
  const sheen = (body.material && body.material.sheen) || 0;
  const sheenRoughness = (body.material && body.material.sheen_roughness);
  const sheenColor = (body.material && body.material.sheen_color);
  const anisotropy = (body.material && body.material.anisotropy) || 0;
  const anisotropyRotation = (body.material && body.material.anisotropy_rotation) || 0;
  const iridescence = (body.material && body.material.iridescence) || 0;
  const iridescenceIOR = (body.material && body.material.iridescence_ior);
  const iridescenceThickness = (body.material && body.material.iridescence_thickness);
  const hasVolume = !!(gltfPbr && gltfPbr.attenuationDistance !== undefined && Number.isFinite(gltfPbr.attenuationDistance));
  const dispersion = (gltfPbr && gltfPbr.dispersion) || (body.material && body.material.dispersion) || 0;
  const usePhysical = !!(gltfPbr && gltfPbr.transmission > 0) || clearcoat > 0 || sheen > 0 || hasVolume || anisotropy > 0 || iridescence > 0 || dispersion > 0;
  const MatClass = usePhysical ? THREE.MeshPhysicalMaterial : THREE.MeshStandardMaterial;
  const mat = new MatClass({
    color: new THREE.Color(albedo[0], albedo[1], albedo[2]),
    roughness: gltfPbr ? gltfPbr.roughnessFactor : body.material.roughness,
    metalness: gltfPbr ? gltfPbr.metallicFactor : body.material.metallic,
  });
  if (clearcoat > 0) {
    mat.clearcoat = clearcoat;
    mat.clearcoatRoughness = clearcoatRoughness;
  }
  if (sheen > 0) {
    mat.sheen = sheen;
    if (sheenRoughness !== undefined && sheenRoughness !== null) mat.sheenRoughness = sheenRoughness;
    if (sheenColor) mat.sheenColor = new THREE.Color(sheenColor[0], sheenColor[1], sheenColor[2]);
  }
  if (anisotropy > 0) {
    mat.anisotropy = anisotropy;
    mat.anisotropyRotation = anisotropyRotation;
    if (typeof geom.computeTangents === 'function') {
      try { geom.computeTangents(); } catch (e) { /* missing uv/index */ }
    }
  }
  if (iridescence > 0) {
    mat.iridescence = iridescence;
    if (iridescenceIOR !== undefined && iridescenceIOR !== null) mat.iridescenceIOR = iridescenceIOR;
    if (iridescenceThickness !== undefined && iridescenceThickness !== null) {
      mat.iridescenceThicknessRange = [iridescenceThickness, iridescenceThickness];
    }
  }
  if (dispersion > 0) {
    mat.dispersion = dispersion;
  }
  if (usePhysical && gltfPbr && gltfPbr.transmission > 0) {
    mat.transmission = gltfPbr.transmission;
    mat.ior = gltfPbr.ior;
    if (gltfPbr.attenuationDistance !== undefined && Number.isFinite(gltfPbr.attenuationDistance)) {
      const ac = gltfPbr.attenuationColor || [1, 1, 1];
      mat.attenuationColor = new THREE.Color(ac[0], ac[1], ac[2]);
      mat.attenuationDistance = gltfPbr.attenuationDistance;
      mat.thickness = gltfPbr.thickness !== undefined ? gltfPbr.thickness : 0;
    } else {
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      if (bb) {
        const dx = bb.max.x - bb.min.x;
        const dy = bb.max.y - bb.min.y;
        const dz = bb.max.z - bb.min.z;
        mat.thickness = Math.min(dx, dy, dz);
      }
    }
  }
  const mapUrl = (gltfPbr && gltfPbr.textureUrl)
    ? gltfPbr.textureUrl
    : (body.material.albedo_map
      ? (body.material.albedo_map.startsWith('/') ? body.material.albedo_map : '/' + body.material.albedo_map)
      : null);
  if (mapUrl) {
    const tex = await loadTexture(mapUrl);
    if ('SRGBColorSpace' in THREE) tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.needsUpdate = true;
    mat.map = tex;
    mat.needsUpdate = true;
  }
  if (gltfPbr && gltfPbr.mrTextureUrl) {
    const mr = await loadTexture(gltfPbr.mrTextureUrl);
    if ('LinearSRGBColorSpace' in THREE) mr.colorSpace = THREE.LinearSRGBColorSpace;
    else if ('NoColorSpace' in THREE) mr.colorSpace = THREE.NoColorSpace;
    mr.wrapS = THREE.RepeatWrapping;
    mr.wrapT = THREE.RepeatWrapping;
    mr.needsUpdate = true;
    // glTF convention: same packed map; Three.js reads roughness from G, metalness from B.
    mat.metalnessMap = mr;
    mat.roughnessMap = mr;
    mat.needsUpdate = true;
  }
  if (gltfPbr && gltfPbr.normalTextureUrl) {
    const nrm = await loadTexture(gltfPbr.normalTextureUrl);
    if ('NoColorSpace' in THREE) nrm.colorSpace = THREE.NoColorSpace;
    else if ('LinearSRGBColorSpace' in THREE) nrm.colorSpace = THREE.LinearSRGBColorSpace;
    nrm.wrapS = THREE.RepeatWrapping;
    nrm.wrapT = THREE.RepeatWrapping;
    nrm.needsUpdate = true;
    mat.normalMap = nrm;
    if (THREE.Vector2) {
      mat.normalScale = new THREE.Vector2(gltfPbr.normalScale, gltfPbr.normalScale);
    }
    mat.needsUpdate = true;
  }
  if (gltfPbr && gltfPbr.occlusionTextureUrl) {
    const ao = await loadTexture(gltfPbr.occlusionTextureUrl);
    if ('NoColorSpace' in THREE) ao.colorSpace = THREE.NoColorSpace;
    else if ('LinearSRGBColorSpace' in THREE) ao.colorSpace = THREE.LinearSRGBColorSpace;
    ao.wrapS = THREE.RepeatWrapping;
    ao.wrapT = THREE.RepeatWrapping;
    ao.needsUpdate = true;
    mat.aoMap = ao;
    mat.aoMapIntensity = gltfPbr.occlusionStrength === undefined ? 1 : gltfPbr.occlusionStrength;
    // MeshStandardMaterial.aoMap reads uv2.
    if (geom.getAttribute('uv') && !geom.getAttribute('uv2')) {
      geom.setAttribute('uv2', geom.getAttribute('uv'));
    }
    mat.needsUpdate = true;
  }
  if (gltfPbr && (gltfPbr.emissiveFactor || gltfPbr.emissiveTextureUrl)) {
    const ef = gltfPbr.emissiveFactor || [0, 0, 0];
    mat.emissive = new THREE.Color(ef[0], ef[1], ef[2]);
    if (gltfPbr.emissiveTextureUrl) {
      const em = await loadTexture(gltfPbr.emissiveTextureUrl);
      if ('SRGBColorSpace' in THREE) em.colorSpace = THREE.SRGBColorSpace;
      em.wrapS = THREE.RepeatWrapping;
      em.wrapT = THREE.RepeatWrapping;
      em.needsUpdate = true;
      mat.emissiveMap = em;
    }
    mat.needsUpdate = true;
  }
  if (gltfPbr && (gltfPbr.alphaMode === 'BLEND' || (gltfPbr.opacity !== undefined && gltfPbr.opacity < 1))) {
    mat.transparent = true;
    mat.opacity = gltfPbr.opacity;
    mat.depthWrite = false;
    mat.needsUpdate = true;
  } else if (gltfPbr && gltfPbr.alphaMode === 'MASK') {
    mat.alphaTest = 0.5;
    mat.needsUpdate = true;
  }
  if (gltfPbr && gltfPbr.doubleSided) {
    mat.side = THREE.DoubleSide;
  }
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.fromArray(position);
  mesh.quaternion.set(rotation[1], rotation[2], rotation[3], rotation[0]);
  mesh.castShadow = body.id !== 'ground' && !mat.transparent;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

document.body.appendChild(renderer.domElement);
renderer.render(scene, camera);

const dataUrl = renderer.domElement.toDataURL('image/png');
const img = document.createElement('img');
img.width = WIDTH;
img.height = HEIGHT;
img.onload = () => { document.title = 'ready'; };
img.src = dataUrl;
document.body.innerHTML = '';
document.body.appendChild(img);
</script>
</body>
</html>
