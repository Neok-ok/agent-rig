<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>threejs-baseline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 800px;
      height: 450px;
      overflow: hidden;
      background: #000;
    }
    canvas, img {
      display: block;
      width: 800px;
      height: 450px;
    }
  </style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.min.js';

const WIDTH = 800;
const HEIGHT = 450;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5cad0);

const camera = new THREE.PerspectiveCamera(40, WIDTH / HEIGHT, 0.1, 100);
camera.position.set(4.2, 2.4, 5.2);
camera.lookAt(0.0, 0.35, 0.0);

const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 3.0);
sun.color.setRGB(1.0, 0.97, 0.92);
sun.position.set(0.45, 1.0, 0.35);
sun.target.position.set(0, 0, 0);
scene.add(sun);
scene.add(sun.target);

const groundMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0.35, 0.36, 0.38),
  roughness: 0.8,
  metalness: 0.0,
});
const ground = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 8), groundMat);
ground.position.set(0, -0.1, 0);
scene.add(ground);

const ballMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0.85, 0.22, 0.16),
  roughness: 0.35,
  metalness: 0.05,
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 48, 32), ballMat);
ball.position.set(0, 0.3987, 0);
scene.add(ball);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  alpha: false,
});
renderer.setSize(WIDTH, HEIGHT, true);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

renderer.render(scene, camera);

const dataUrl = renderer.domElement.toDataURL('image/png');
const img = document.createElement('img');
img.width = WIDTH;
img.height = HEIGHT;
img.onload = () => {
  document.title = 'ready';
};
img.src = dataUrl;
document.body.innerHTML = '';
document.body.appendChild(img);
</script>
</body>
</html>
